[package]
name = "yakap-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Yakap Bear prototype — Rust API (Axum + SQLx + PostgreSQL)"
publish = false

[lib]
name = "yakap_api"
path = "src/lib.rs"

[[bin]]
name = "yakap-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "chrono",
  "json",
  "migrate",
  "derive",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Optimize dependencies in dev builds (bcrypt + SQLx are slow unoptimized).
[profile.dev.package."*"]
opt-level = 2
